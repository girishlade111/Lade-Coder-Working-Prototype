        // Extract HTML code from response (handles cases where AI returns explanation + code)
        function extractHTMLCode(responseText) {
            // Look for HTML code blocks in the response
            const htmlRegex = /<\!DOCTYPE\s+html[^>]*>/i;
            const match = responseText.match(htmlRegex);
            
            if (match) {
                // Find the start of the HTML code
                const startIndex = responseText.indexOf(match[0]);
                
                // Try to find the end of the HTML code
                const endIndex = responseText.lastIndexOf('</html>');
                if (endIndex > startIndex) {
                    return responseText.substring(startIndex, endIndex + 7);
                }
            }
            
            // If no HTML found, try to find code block with language html
            const codeRegex = /```html\s*([\s\S]*?)```/i;
            const codeMatch = responseText.match(codeRegex);
            
            if (codeMatch && codeMatch[1]) {
                return codeMatch[1];
            }
            
            // If still no HTML found, look for any HTML-like content
            const htmlLikeRegex = /<html[^>]*>([\s\S]*)<\/html>/i;
            const htmlLikeMatch = responseText.match(htmlLikeRegex);
            
            if (htmlLikeMatch && htmlLikeMatch[1]) {
                return htmlLikeMatch[1];
            }
            
            // As last resort, return the entire response if it looks like HTML
            if (responseText.includes('<html') || responseText.includes('<body')) {
                return responseText;
            }
            
            // Return empty string if no code could be extracted
            return '';
        }

        // Update output (code and preview)
        function updateOutput(htmlContent) {
            // Save current code to history before updating
            if (currentCode) {
                codeHistory.push(currentCode);
                restoreButton.classList.remove('hidden');
            }
            
            // Extract actual HTML code from the response
            const extractedCode = extractHTMLCode(htmlContent);
            
            if (extractedCode) {
                currentCode = extractedCode;
                
                // Update code block with raw code only
                codeBlock.textContent = extractedCode;
                
                // Update preview iframe
                previewFrame.srcdoc = extractedCode;
                
                // Show download button when code is available
                downloadButton.classList.remove('hidden');
            } else {
                // If no valid code was extracted, show error
                console.error("Could not extract valid HTML code from response");
                currentCode = '';
                codeBlock.textContent = 'Error: Could not extract valid HTML code from the AI response.';
                previewFrame.srcdoc = '<div style="padding: 20px; color: red;">Error: Could not extract valid HTML code from the AI response.</div>';
            }
        }

        // Download code as HTML file
        function downloadCode() {
            if (!currentCode) return;
            
            const blob = new Blob([currentCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'lade-coder-project.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Restore previous code
        function restorePreviousCode() {
            if (codeHistory.length > 0) {
                const previousCode = codeHistory.pop();
                currentCode = previousCode;
                updateOutput(previousCode);
                
                if (codeHistory.length === 0) {
                    restoreButton.classList.add('hidden');
                }
                
                addMessageToChat("✅ Restored to previous version", 'ai');
            }
        }

        // Generate code using OpenRouter Qwen model (optimized for speed)
        async function generateCodeWithQwen(prompt, isFollowUp = false) {
            try {
                let content = prompt;
                if (isFollowUp && currentCode) {
                    content = `Modify the following HTML/CSS/JS code based on this request: ${prompt}\n\nReturn only the complete modified code, no explanations.`;
                } else {
                    content = `Generate only HTML/CSS/JS code for: ${prompt}. Return only the code, no explanations.`;
                }
                
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Lade Coder",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "qwen/qwen3-coder:free",
                        "messages": [
                            {
                                "role": "user",
                                "content": content
                            }
                        ],
                        "temperature": 0.7,
                        "max_tokens": 2000
                    })
                });
                
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("Qwen API Error:", error);
                return "Error generating code with Qwen. Please try again.";
            }
        }

        // Generate code using OpenRouter Kimi model (more powerful)
        async function generateCodeWithKimi(prompt, isFollowUp = false) {
            try {
                let content = prompt;
                if (isFollowUp && currentCode) {
                    content = `Modify the following HTML/CSS/JS code based on this request: ${prompt}\n\nReturn only the complete modified code, no explanations.`;
                } else {
                    content = `Generate only HTML/CSS/JS code for: ${prompt}. Return only the code, no explanations.`;
                }
                
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Lade Coder",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "moonshotai/kimi-dev-72b:free",
                        "messages": [
                            {
                                "role": "user",
                                "content": content
                            }
                        ],
                        "temperature": 0.7,
                        "max_tokens": 2500
                    })
                });
                
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("Kimi API Error:", error);
                return "Error generating code with Kimi. Please try again.";
            }
        }

        // Generate code using Hugging Face (creative)
        async function generateCodeWithHuggingFace(prompt, isFollowUp = false) {
            try {
                let content = prompt;
                if (isFollowUp && currentCode) {
                    content = `Modify the following HTML/CSS/JS code based on this request: ${prompt}\n\nReturn only the complete modified code, no explanations.`;
                } else {
                    content = `Generate HTML/CSS/JS code for: ${prompt}. Return only the code.`;
                }
                
                const response = await fetch("https://api-inference.huggingface.co/models/microsoft/Phi-3-mini-4k-instruct", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HUGGINGFACE_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "inputs": content,
                        "parameters": {
                            "max_new_tokens": 1500,
                            "temperature": 0.7
                        }
                    })
                });
                
                const data = await response.json();
                return data[0].generated_text;
            } catch (error) {
                console.error("Hugging Face API Error:", error);
                return "Error generating code with Hugging Face. Please try again.";
            }
        }

        // Handle code generation based on selected model
        async function generateCode(prompt, model, isFollowUp = false) {
            switch(model) {
                case 'qwen':
                    return await generateCodeWithQwen(prompt, isFollowUp);
                case 'kimi':
                    return await generateCodeWithKimi(prompt, isFollowUp);
                case 'huggingface':
                    return await generateCodeWithHuggingFace(prompt, isFollowUp);
                default:
                    // For demo purposes, cycle through mock snippets
                    if (isFollowUp) {
                        return mockCodeSnippets[1];
                    }
                    return mockCodeSnippets[0];
            }
        }

        // Handle initial prompt submission
        async function handleInitialPrompt() {
            const promptText = initialPromptInput.value.trim();
            const selectedModel = modelSelector.value;
            
            if (!promptText || isGenerating) return;
            
            isGenerating = true;
            initialSendButton.innerHTML = '<div class="loading-spinner"></div>';
            
            // Hide initial view and show main workspace
            initialView.style.opacity = '0';
            initialView.style.pointerEvents = 'none';
            
            setTimeout(async () => {
                initialView.classList.add('hidden');
                mainWorkspace.classList.remove('hidden');
                
                // Add user message
                addMessageToChat(promptText, 'user');
                
                // Add typing indicator
                addTypingIndicator();
                
                // Generate code
                const generatedCode = await generateCode(promptText, selectedModel, false);
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Add AI response
                addMessageToChat("✨ I've created your website! Check the preview and code tabs.", 'ai');
                
                // Update code and preview
                updateOutput(generatedCode);
                
                // Reset button
                initialSendButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
                
                isGenerating = false;
            }, 100);
        }

        // Handle omni prompt submission (follow-up)
        async function handleOmniPrompt() {
            const promptText = omniPromptInput.value.trim();
            const selectedModel = omniModelSelector.value;
            
            if (!promptText || isGenerating) return;
            
            isGenerating = true;
            omniSendButton.innerHTML = '<div class="loading-spinner"></div>';
            
            // Add user message
            addMessageToChat(promptText, 'user');
            omniPromptInput.value = '';
            
            // Add typing indicator
            addTypingIndicator();
            
            // Generate code with follow-up context
            const generatedCode = await generateCode(promptText, selectedModel, true);
            
            // Remove typing indicator
            removeTypingIndicator();
            
            // Add AI response
            addMessageToChat("✅ I've updated your website based on your request!", 'ai');
            
            // Update code and preview
            updateOutput(generatedCode);
            
            // Reset button
            omniSendButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
            
            isGenerating = false;
        }

        // Switch tabs
        function switchTab(tab) {
            if (tab === 'preview') {
                previewTab.className = 'px-6 py-4 font-bold border-b-2 border-purple-500 text-white flex items-center gap-2';
                codeTab.className = 'px-6 py-4 font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2';
                previewContainer.classList.remove('hidden');
                codeContainer.classList.add('hidden');
            } else {
                codeTab.className = 'px-6 py-4 font-bold border-b-2 border-purple-500 text-white flex items-center gap-2';
                previewTab.className = 'px-6 py-4 font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2';
                codeContainer.classList.remove('hidden');
                previewContainer.classList.add('hidden');
            }
        }

        // Event Listeners
        initialSendButton.addEventListener('click', handleInitialPrompt);
        initialPromptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInitialPrompt();
        });

        omniSendButton.addEventListener('click', handleOmniPrompt);
        omniPromptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleOmniPrompt();
        });

        previewTab.addEventListener('click', () => switchTab('preview'));
        codeTab.addEventListener('click', () => switchTab('code'));
        restoreButton.addEventListener('click', restorePreviousCode);
        downloadButton.addEventListener('click', downloadCode);
    </script>
</body>
</html>
